<div class="wrap">
<h1>AI Grid — Tenant Admin Flows</h1>
<p class="sub">MVP: SSO group management only &middot; No K8s access &middot; No platform UI &middot; Corporate IdP is the only tool</p>

  <marker id="ah-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#bc8cff" stroke-width="1.2"/></marker>
  <marker id="ah-teal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#39d2c0" stroke-width="1.2"/></marker>
  <marker id="ah-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#d29922" stroke-width="1.2"/></marker>
  <marker id="ah-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#f85149" stroke-width="1.2"/></marker>
  <marker id="ah-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#f0883e" stroke-width="1.2"/></marker>

<!-- ═══════════════════════════════════════════
     TENANT ADMIN
     ═══════════════════════════════════════════ -->
<rect x="80" y="16" width="220" height="55" rx="8" fill="#1a3050" stroke="#58a6ff" stroke-width="1.5" filter="url(#sh)"/>
<text x="190" y="34" text-anchor="middle" fill="#58a6ff" font-size="9" font-weight="600" letter-spacing="0.5">TENANT ADMIN</text>
<text x="190" y="50" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">Team Lead / Designated Admin</text>
<text x="190" y="63" text-anchor="middle" fill="#8b949e" font-size="8">Manages WHO can access AI — via SSO groups only</text>

<!-- ═══════════════════════════════════════════
     MVP: CORPORATE IdP — the only tool
     ═══════════════════════════════════════════ -->
<rect x="40" y="90" width="520" height="420" rx="10" fill="#161b22" fill-opacity="0.3" stroke="#58a6ff" stroke-width="2" stroke-dasharray="8,4"/>
<text x="56" y="108" fill="#58a6ff" font-size="9" font-weight="600">MVP — TENANT ADMIN'S WORLD</text>
<text x="500" y="108" text-anchor="end" fill="#6e7681" font-size="7">no K8s, no platform UI</text>

<!-- Corporate IdP -->
<rect x="65" y="120" width="240" height="55" rx="6" fill="#2a1f0d" stroke="#d29922" stroke-width="1.5" filter="url(#sh)"/>
<text x="185" y="138" text-anchor="middle" fill="#d29922" font-size="8" font-weight="600">CORPORATE IdP</text>
<text x="185" y="154" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">Keycloak / LDAP / Red Hat SSO</text>
<text x="185" y="166" text-anchor="middle" fill="#8b949e" font-size="7">The Tenant Admin's only management tool</text>

<!-- Admin → IdP -->
<path d="M190,71 L185,116" fill="none" stroke="#d29922" stroke-width="1.2" marker-end="url(#ah-amber)"/>

<!-- ═══════════════════════════════════════════
     SSO GROUPS — what the admin manages
     ═══════════════════════════════════════════ -->
<rect x="65" y="195" width="480" height="175" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="305" y="213" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="600">SSO Groups (managed by Tenant Admin)</text>

<!-- Standard group -->
<rect x="80" y="228" width="215" height="60" rx="5" fill="#162416" stroke="#3fb950" stroke-width="1.2" filter="url(#sh)"/>
<text x="187" y="244" text-anchor="middle" fill="#3fb950" font-size="8" font-weight="600">ai-team-a-standard</text>
<text x="95" y="260" fill="#e6edf3" font-size="7">alice, bob, charlie, dave</text>
<text x="95" y="274" fill="#6e7681" font-size="7">→ Qwen3, Sonnet, Llama, GPT-4o</text>
<text x="95" y="284" fill="#6e7681" font-size="7">→ 500K tokens/user/month</text>

<!-- Premium group -->
<rect x="310" y="228" width="215" height="60" rx="5" fill="#1c1340" stroke="#8957e5" stroke-width="1.2" filter="url(#sh)"/>
<text x="417" y="244" text-anchor="middle" fill="#8957e5" font-size="8" font-weight="600">ai-team-a-premium</text>
<text x="325" y="260" fill="#e6edf3" font-size="7">eve, frank</text>
<text x="325" y="274" fill="#6e7681" font-size="7">→ all standard + Fable, Opus</text>
<text x="325" y="284" fill="#6e7681" font-size="7">→ 2M tokens/user/month</text>

<!-- CI group -->
<rect x="80" y="300" width="215" height="50" rx="5" fill="#0d2626" stroke="#39d2c0" stroke-width="1.2" filter="url(#sh)"/>
<text x="187" y="316" text-anchor="middle" fill="#39d2c0" font-size="8" font-weight="600">ai-team-a-ci</text>
<text x="95" y="332" fill="#e6edf3" font-size="7">ci-bot-1, ci-bot-2 (service accounts)</text>
<text x="95" y="342" fill="#6e7681" font-size="7">→ Qwen3, Sonnet · 5M tokens/month (shared)</text>

<!-- Arrow: IdP → Groups -->
<path d="M185,175 L185,191" fill="none" stroke="#d29922" stroke-width="1.2" marker-end="url(#ah-amber)"/>

<!-- Note about what model/quota mapping means -->
<text x="310" y="320" fill="#6e7681" font-size="7" font-style="italic">Group → model + quota mapping</text>
<text x="310" y="332" fill="#6e7681" font-size="7" font-style="italic">configured by Platform Admin</text>
<text x="310" y="344" fill="#6e7681" font-size="7" font-style="italic">during tenant onboarding</text>

<!-- ═══════════════════════════════════════════
     TENANT ADMIN ACTIONS
     ═══════════════════════════════════════════ -->
<rect x="65" y="385" width="480" height="110" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="305" y="403" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="600">What the Tenant Admin Can Do (MVP)</text>

<text x="80" y="425" fill="#3fb950" font-size="8" font-weight="600">●</text>
<text x="95" y="425" fill="#e6edf3" font-size="8">Add user to a group → user gets access to that tier's models + quota</text>

<text x="80" y="443" fill="#3fb950" font-size="8" font-weight="600">●</text>
<text x="95" y="443" fill="#e6edf3" font-size="8">Remove user from group → user loses access immediately</text>

<text x="80" y="461" fill="#3fb950" font-size="8" font-weight="600">●</text>
<text x="95" y="461" fill="#e6edf3" font-size="8">Move user between groups → change access tier (standard → premium)</text>

<text x="80" y="479" fill="#d29922" font-size="8" font-weight="600">●</text>
<text x="95" y="479" fill="#8b949e" font-size="8">Model visibility or quota changes → request to Platform Admin (manual)</text>

<!-- ═══════════════════════════════════════════
     HOW IT WORKS AT RUNTIME
     ═══════════════════════════════════════════ -->
<rect x="620" y="90" width="380" height="240" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="810" y="112" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">How SSO Groups Map to Platform Access</text>

<text x="635" y="140" fill="#d29922" font-size="9" font-weight="600">1</text>
<text x="652" y="140" fill="#8b949e" font-size="8">Platform Admin (onboarding, one-time):</text>
<text x="652" y="156" fill="#6e7681" font-size="7">Creates MaaSAuthPolicy → maps SSO group to model list</text>
<text x="652" y="168" fill="#6e7681" font-size="7">Creates MaaSSubscription → maps SSO group to token budget</text>

<text x="635" y="192" fill="#58a6ff" font-size="9" font-weight="600">2</text>
<text x="652" y="192" fill="#8b949e" font-size="8">Tenant Admin (day-to-day):</text>
<text x="652" y="208" fill="#6e7681" font-size="7">Adds alice to ai-team-a-standard in Keycloak</text>

<text x="635" y="232" fill="#3fb950" font-size="9" font-weight="600">3</text>
<text x="652" y="232" fill="#8b949e" font-size="8">At runtime (automatic):</text>
<text x="652" y="248" fill="#6e7681" font-size="7">alice authenticates → SSO returns groups</text>
<text x="652" y="260" fill="#6e7681" font-size="7">→ MaaSAuthPolicy matches group → model access granted</text>
<text x="652" y="272" fill="#6e7681" font-size="7">→ MaaSSubscription matches group → quota enforced</text>

<text x="635" y="296" fill="#3fb950" font-size="9" font-weight="600">4</text>
<text x="652" y="296" fill="#8b949e" font-size="8">alice calls GET /v1/models → sees 4 models</text>
<text x="652" y="310" fill="#8b949e" font-size="8">alice calls POST /v1/chat/completions → quota checked</text>

<!-- ═══════════════════════════════════════════
     EXAMPLE SCENARIO
     ═══════════════════════════════════════════ -->
<rect x="620" y="350" width="380" height="180" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="810" y="370" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">Example: Upgrade a User</text>

<text x="635" y="394" fill="#d29922" font-size="9" font-weight="600">1</text>
<text x="652" y="394" fill="#8b949e" font-size="8">alice is in ai-team-a-standard</text>
<text x="652" y="408" fill="#6e7681" font-size="7">→ sees: Qwen3, Sonnet, Llama, GPT-4o</text>
<text x="652" y="420" fill="#6e7681" font-size="7">→ budget: 500K tokens/month</text>

<text x="635" y="444" fill="#58a6ff" font-size="9" font-weight="600">2</text>
<text x="652" y="444" fill="#8b949e" font-size="8">Tenant Admin moves alice to ai-team-a-premium</text>
<text x="652" y="458" fill="#6e7681" font-size="7">(in Keycloak: remove from standard, add to premium)</text>

<text x="635" y="482" fill="#3fb950" font-size="9" font-weight="600">3</text>
<text x="652" y="482" fill="#8b949e" font-size="8">Next time alice authenticates:</text>
<text x="652" y="496" fill="#6e7681" font-size="7">→ sees: Qwen3, Sonnet, Llama, GPT-4o + Fable, Opus</text>
<text x="652" y="508" fill="#6e7681" font-size="7">→ budget: 2M tokens/month</text>

<text x="652" y="526" fill="#6e7681" font-size="7" font-style="italic">No platform ticket, no CRD change, no deploy. Just a group change.</text>

<!-- ═══════════════════════════════════════════
     WHAT TENANT ADMIN CANNOT SEE
     ═══════════════════════════════════════════ -->
<rect x="40" y="530" width="520" height="90" rx="6" fill="#1a0a0a" stroke="#f85149" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="300" y="550" text-anchor="middle" fill="#f85149" font-size="9" font-weight="600">INVISIBLE TO TENANT ADMIN</text>

<text x="55" y="570" fill="#f85149" font-size="7" font-weight="600">✗</text>
<text x="67" y="570" fill="#6e7681" font-size="8">K8s API, CRDs, kubectl</text>

<text x="210" y="570" fill="#f85149" font-size="7" font-weight="600">✗</text>
<text x="222" y="570" fill="#6e7681" font-size="8">Clusters, nodes, GPUs</text>

<text x="370" y="570" fill="#f85149" font-size="7" font-weight="600">✗</text>
<text x="382" y="570" fill="#6e7681" font-size="8">Other tenants' data</text>

<text x="55" y="590" fill="#f85149" font-size="7" font-weight="600">✗</text>
<text x="67" y="590" fill="#6e7681" font-size="8">Grid topology, SWIM</text>

<text x="210" y="590" fill="#f85149" font-size="7" font-weight="600">✗</text>
<text x="222" y="590" fill="#6e7681" font-size="8">ACM, GitOps pipelines</text>

<text x="370" y="590" fill="#f85149" font-size="7" font-weight="600">✗</text>
<text x="382" y="590" fill="#6e7681" font-size="8">Model deployment (vLLM)</text>

<text x="55" y="610" fill="#6e7681" font-size="7">The platform is a black box. The Tenant Admin manages people, not infrastructure.</text>

<!-- ═══════════════════════════════════════════
     POST-MVP: WHAT CHANGES
     ═══════════════════════════════════════════ -->
<rect x="620" y="550" width="380" height="170" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1" stroke-dasharray="4,3"/>
<text x="810" y="572" text-anchor="middle" fill="#d29922" font-size="9" font-weight="600">POST-MVP — THIN ADMIN UI</text>
<text x="810" y="586" text-anchor="middle" fill="#6e7681" font-size="7">Added when SSO groups alone are not enough</text>

<text x="635" y="610" fill="#3fb950" font-size="8" font-weight="600">+</text>
<text x="652" y="610" fill="#e6edf3" font-size="8">Disable/enable models from platform catalog</text>
<text x="652" y="622" fill="#6e7681" font-size="7">(SSO groups can't express "no Fable for anyone")</text>

<text x="635" y="642" fill="#3fb950" font-size="8" font-weight="600">+</text>
<text x="652" y="642" fill="#e6edf3" font-size="8">Tune per-group quotas within tenant ceiling</text>
<text x="652" y="654" fill="#6e7681" font-size="7">(SSO groups can't express "Engineering gets 6M")</text>

<text x="635" y="674" fill="#3fb950" font-size="8" font-weight="600">+</text>
<text x="652" y="674" fill="#e6edf3" font-size="8">BYOK — add external models with own API keys</text>
<text x="652" y="686" fill="#6e7681" font-size="7">(needs a configuration surface beyond SSO)</text>

<text x="635" y="706" fill="#3fb950" font-size="8" font-weight="600">+</text>
<text x="652" y="706" fill="#e6edf3" font-size="8">Bulk key revocation for own tenant</text>

     KEY PRINCIPLES

<text x="1055" y="334" fill="#3fb950" font-size="8" font-weight="600">✓</text>
<text x="1072" y="334" fill="#8b949e" font-size="8">Zero platform-specific tooling for MVP</text>

<text x="1055" y="352" fill="#3fb950" font-size="8" font-weight="600">✓</text>
<text x="1072" y="352" fill="#8b949e" font-size="8">Uses corporate IdP admins already know</text>

<text x="1055" y="424" fill="#3fb950" font-size="8" font-weight="600">✓</text>
